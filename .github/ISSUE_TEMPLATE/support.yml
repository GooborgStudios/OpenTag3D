name: State your Support for the OpenTag3D Standard
description: For companies, organizations, or projects that want to say they support the OpenTag3D standard.
title: "New Supporter: [Company Name]"

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in becoming an **OpenTag3D Supporter**!

        Supporters are companies and projects stating that they support the OpenTag3D standard and intend to implement the standard into the project.  Supporters are listed on our website, promoting your commitment to open standards in 3D printing.

        Becoming a supporter requires no financial contribution.  However, if you wish to make one, you may do so by donating to Gooborg Studios' founder via [Ko-Fi](https://ko-fi.com/queengooborg) or [PayPal](https://paypal.me/VinylDarkscratch)!

        Please fill out the following information as completely as possible.

  - type: input
    id: company_name
    attributes:
      label: Company / Project Name
      placeholder: "e.g., Polar Filament"
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Website URL
      placeholder: "https://example.com"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Backer Category
      description: Select the category that best describes your role in 3D printing.
      options:
        - Filament Manufacturer
        - Printer / Accessory Hardware
        - Website / Application
        - Other (please specify in "Additional Information")
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Information
      description: Share any relevant notes, social media links, or details about your current/planned involvement with OpenTag3D.
      placeholder: "Optional details..."
    validations:
      required: false

  - type: checkboxes
    id: authorization
    attributes:
      label: Authorization Confirmation
      description: Please confirm that you are authorized to submit this application on behalf of the company/project.
      options:
        - label: "I confirm that I am an authorized representative of the company/project."
          required: true
